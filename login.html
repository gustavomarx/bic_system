<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIC System — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #0d1b2a 0%, #1b2d45 60%, #0a1628 100%);
      padding: 24px 16px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30,120,220,.07) 0%, transparent 70%);
      top: -100px; right: -100px;
      pointer-events: none;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 40px 36px;
      width: min(420px, 100%);
      box-shadow: 0 24px 64px rgba(0,0,0,.45);
      display: flex;
      flex-direction: column;
      gap: 22px;
      position: relative;
      z-index: 1;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      padding-bottom: 18px;
      border-bottom: 1px solid #e8edf3;
    }

    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #e53935, #b71c1c);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 18px;
      box-shadow: 0 2px 8px rgba(229,57,53,.35);
      flex-shrink: 0;
    }

    .logo-text { display: flex; flex-direction: column; line-height: 1.25; }
    .logo-title { font-size: 16px; font-weight: 700; color: #1a2540; }
    .logo-sub { font-size: 11px; color: #7a8ba8; letter-spacing: .1em; text-transform: uppercase; }

    h2 {
      font-size: 20px; font-weight: 600; color: #1a2540;
      text-align: center; margin: 0;
    }

    label {
      display: block;
      font-size: 11px; font-weight: 600;
      color: #7a8ba8; letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 6px;
    }

    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      border: 1.5px solid #dde3ed;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px; color: #1a2540;
      outline: none;
      transition: border-color .15s;
      background: #fff;
    }
    input:focus { border-color: #e53935; }

    .field { display: flex; flex-direction: column; gap: 5px; }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 42px; }
    .toggle-pw {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: #7a8ba8; padding: 2px;
      display: flex; align-items: center;
    }
    .toggle-pw:hover { color: #e53935; }

    .remember {
      display: flex; align-items: center; gap: 8px;
      cursor: pointer; user-select: none;
    }
    .remember input { width: 15px; height: 15px; accent-color: #e53935; cursor: pointer; }
    .remember span { font-size: 13px; color: #7a8ba8; }

    .btn {
      width: 100%; padding: 14px;
      background: #e53935; color: #fff;
      border: none; border-radius: 10px;
      font-size: 14px; font-weight: 700;
      letter-spacing: .06em;
      cursor: pointer; transition: background .15s, opacity .15s;
    }
    .btn:hover { background: #c62828; }
    .btn:disabled { opacity: .55; cursor: not-allowed; }

    .error {
      display: none;
      padding: 10px 14px;
      background: #fff1f2; color: #b91c1c;
      border: 1px solid #fca5a5;
      border-radius: 8px; font-size: 13px; text-align: center;
    }
    .error.show { display: block; }

    .footer {
      text-align: center; font-size: 12px;
      color: #7a8ba8; padding-top: 4px;
      border-top: 1px solid #e8edf3;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">B</div>
      <div class="logo-text">
        <span class="logo-title">BIC System</span>
        <span class="logo-sub">Portal Sellout</span>
      </div>
    </div>

    <h2>Acesso ao Sistema</h2>

    <form id="form" style="display:flex;flex-direction:column;gap:14px;">
      <div class="field">
        <label for="email">E-mail</label>
        <input id="email" type="email" placeholder="seu@email.com" required autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Senha</label>
        <div class="password-wrap">
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
          <button type="button" class="toggle-pw" id="togglePw" title="Ver/ocultar senha">
            <svg id="iconEye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <label class="remember">
        <input type="checkbox" id="remember" />
        <span>Lembrar acesso por 30 dias</span>
      </label>

      <div class="error" id="error"></div>

      <button class="btn" type="submit" id="btn">Entrar</button>
    </form>

    <div class="footer">BIC System &mdash; Uso interno</div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'
    import { getAuth, signInWithEmailAndPassword, setPersistence, browserLocalPersistence, browserSessionPersistence } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js'

    const firebaseConfig = window.__BIC_FIREBASE_CONFIG__

    const firebaseApp = initializeApp(firebaseConfig)
    const auth = getAuth(firebaseApp)

    // Se já há sessão ativa no backend, redireciona
    fetch('/api/me', { credentials: 'include' })
      .then(r => { if (r.ok) window.location.href = '/' })
      .catch(() => {})

    // Toggle senha
    document.getElementById('togglePw').addEventListener('click', () => {
      const input = document.getElementById('password')
      const isText = input.type === 'text'
      input.type = isText ? 'password' : 'text'
      document.getElementById('iconEye').innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/>'
    })

    document.getElementById('form').addEventListener('submit', async e => {
      e.preventDefault()
      const btn = document.getElementById('btn')
      const errorEl = document.getElementById('error')
      const email = document.getElementById('email').value
      const password = document.getElementById('password').value
      const remember = document.getElementById('remember').checked

      btn.disabled = true
      btn.textContent = 'Entrando…'
      errorEl.classList.remove('show')

      try {
        await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence)
        const { user } = await signInWithEmailAndPassword(auth, email, password)
        const idToken = await user.getIdToken()

        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ idToken }),
        })
        const data = await res.json()
        if (res.ok) {
          window.location.href = '/'
        } else {
          errorEl.textContent = data.error || 'Erro ao fazer login'
          errorEl.classList.add('show')
        }
      } catch (err) {
        const msg = err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found'
          ? 'E-mail ou senha incorretos.'
          : err.code === 'auth/too-many-requests'
          ? 'Muitas tentativas. Aguarde e tente novamente.'
          : 'Erro ao fazer login. Tente novamente.'
        errorEl.textContent = msg
        errorEl.classList.add('show')
      } finally {
        btn.disabled = false
        btn.textContent = 'Entrar'
      }
    })
  </script>

  <!-- __FIREBASE_CONFIG_PLACEHOLDER__ -->
</body>
</html>
